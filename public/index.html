<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPC · 我的项目上线了</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><strong>OPC / 一人公司智造营</strong><span>DAY 04 · 部署实验室</span></header><main><section class="intro"><p class="tag">从我的电脑，到全世界</p><h1>我的项目<br>上线了<span>。</span></h1><p>填写你的创意，让云端服务器处理并返回一张项目卡片。把公网链接发给朋友，他们也能访问。</p><div class="path">浏览器 <b>→</b> 后端服务器 <b>→</b> 项目卡片</div></section><section class="panel"><div class="label">01 / 发布一个小创意</div><form id="form"><label for="name">项目名称</label><input id="name" name="name" maxlength="60" required placeholder="例如：校园失物招领站"><label for="description">你的项目解决什么问题？</label><textarea id="description" name="description" maxlength="500" required placeholder="帮助同学们更快找到丢失的物品……"></textarea><button id="submit">发送给服务器 ↗</button></form><p id="status" role="status">这是后端处理演示，不会永久保存数据。</p><article id="result" hidden><span class="label">服务器返回的项目卡片</span><h2 id="result-name"></h2><p id="result-description"></p><small id="result-meta"></small></article></section><section class="server"><div><span class="label">02 / 确认后端正在运行</span><p id="server-status" role="status">点击按钮获取服务器的实时时间。</p></div><button id="time" class="secondary">获取服务器时间</button></section></main><footer>HTML + CSS + JavaScript / Node.js Backend · Render 部署测试</footer></body></html>
